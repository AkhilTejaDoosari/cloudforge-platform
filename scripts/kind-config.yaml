# Local kind cluster config for Phase 3.
# Maps host ports 80/443 into the control-plane node so ingress-nginx can bind
# them directly (kind's documented pattern for local ingress testing), and
# labels the node so ingress-nginx's node-affinity for kind schedules onto it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
