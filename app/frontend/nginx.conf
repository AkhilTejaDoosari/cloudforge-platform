server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy backend endpoints so the browser only ever talks to one
    # origin (this container). Same pattern the Kubernetes Ingress will use
    # in Phase 3 — no CORS needed anywhere.
    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
