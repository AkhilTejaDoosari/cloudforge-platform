apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudforge-dev

resources:
  - namespace.yaml
  - ../../base

# Generates a real Secret from a gitignored local file — the values never
# live in a committed manifest. See secrets.env.example for the template.
secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env

# Without this, Kustomize appends a content hash to the generated Secret's
# name (e.g. postgres-credentials-8f92kt), which would break the
# secretKeyRef/envFrom name references in the base manifests unless every
# other manifest referencing it were also generated through Kustomize.
# Disabling it keeps the name stable and simple for this project's scale.
generatorOptions:
  disableNameSuffixHash: true
