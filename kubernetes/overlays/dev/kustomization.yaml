apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudforge-dev

resources:
  - namespace.yaml
  - ../../base

# postgres-credentials is intentionally NOT generated here (no
# secretGenerator). It used to be, reading a gitignored secrets.env — that
# worked for a plain `kubectl apply -k`, but breaks under ArgoCD (Phase 7):
# the repo-server runs `kustomize build` against the *committed* repo
# content, where secrets.env never exists by design, so the build would
# fail before ArgoCD ever got to apply anything. The base Deployments still
# reference the Secret by name; it's provisioned out-of-band instead —
# scripts/create-postgres-secret.sh for local kind, and (in a real AWS
# environment) External Secrets Operator pulling from Secrets Manager in
# Phase 9. This is a standard GitOps pattern: git holds the reference to a
# secret's name, never its generation logic or values.
