apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # No storageClassName set: uses the cluster default (kind ships
  # local-path-provisioner as "standard" by default; EKS will use its own
  # default gp3-backed class in Phase 6 — this manifest doesn't need to know).
